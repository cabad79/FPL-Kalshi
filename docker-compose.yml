version: '3.8'

services:
  kalshi-mcp:
    build:
      context: .
      dockerfile: ./fpl-mcp-v2/Dockerfile
    container_name: kalshi-mcp-server
    ports:
      - "8000:8000"
    environment:
      # Kalshi API Configuration
      KALSHI_API_URL: ${KALSHI_API_URL:-https://api.kalshi.com}
      KALSHI_API_KEY: ${KALSHI_API_KEY}
      KALSHI_SECRET_KEY: ${KALSHI_SECRET_KEY}

      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Data Service Configuration
      FPL_API_URL: ${FPL_API_URL:-https://fantasy.premierleague.com/api}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
      FOOTBALL_DATA_API_URL: ${FOOTBALL_DATA_API_URL:-https://api.football-data.org/v4}

      # Cache Configuration
      CACHE_MAX_SIZE: ${CACHE_MAX_SIZE:-10000}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}

      # Trading Configuration
      KELLY_FRACTION: ${KELLY_FRACTION:-0.25}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.65}
      MAX_POSITION_PERCENT: ${MAX_POSITION_PERCENT:-0.05}

      # Python Configuration
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      # Mount local code for development
      - ./fpl-mcp-v2/src:/app/src
      - ./fpl-mcp-v2/tests:/app/tests
      - ./models:/app/models
      # Mount logs
      - ./logs:/app/logs

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logs:

networks:
  default:
    name: kalshi-network
